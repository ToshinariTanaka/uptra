<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- デプロイ時に、秘密情報を含まない会員認証基盤の公開URLを content に設定します。 -->
  <meta name="uptra-auth-base-url" content="" />
  <title>会員ページ | アプトレ</title>
  <link rel="stylesheet" href="styles/main.css" />
  <style id="auth-pending-style">
    body { visibility: hidden; }
  </style>
  <script type="module">
    import { requireMember } from "./scripts/auth-client.js";
    if (await requireMember()) {
      document.getElementById("auth-pending-style").remove();
    }
  </script>
</head>
<body>
  <main class="landing-wrap">
    <section class="hero">
      <p class="hero-kicker">Up塾トレーニング</p>
      <h1 class="hero-title">学習メニュー</h1>
      <p class="hero-copy">
        ログインしました。<br />
        ここから学習を始めてください。
      </p>

      <div class="hero-actions">
        <a class="btn btn-primary" href="https://toshinaritanaka.github.io/junior-english-words-game/">中学英単語RPGを開く</a>
        <a class="btn btn-accent" href="trial-history.html">中学歴史一問一答基礎</a>
        <a class="btn btn-accent" href="apps/history-quiz-app-v2/index.html">中学歴史一問一答 v2（開発版）</a>
        <a class="btn btn-primary" href="https://gramup.sintechadev.top/ask-ai">英文読解トレーニング</a>
        <a class="btn btn-essay" href="https://toshinaritanaka.github.io/essay-training-app/">小論文トレーニング</a>
        <a class="btn btn-primary" href="https://english-words-game-junior.onrender.com/study-app/">中学生英単語アプリ</a>
        <a class="btn btn-primary" href="https://english-words-game-1ph3.onrender.com/study-app/">英単語・チャンク・文節・英文トレーニング</a>
        <button id="logout-btn" class="btn btn-secondary" type="button">ログアウト</button>
      </div>
    </section>

    <section class="panel">
      <h2>今日のおすすめ</h2>
      <p>
        中学生英単語アプリ・英単語RPG・英単語/チャンク/文節/英文トレーニング・英文読解・歴史一問一答（基礎/v2）・小論文から1つ選んで、少しずつ進めましょう。
      </p>
    </section>
  </main>

  <script type="module">
    import { logout } from "./scripts/auth-client.js";
    document.getElementById("logout-btn").addEventListener("click", async function () {
      this.disabled = true;
      try {
        await logout();
      } catch {
        this.disabled = false;
      }
    });
  </script>
</body>
</html>

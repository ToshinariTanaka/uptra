<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- デプロイ時に、秘密情報を含まない会員認証基盤の公開URLを content に設定します。 -->
  <meta name="uptra-auth-base-url" content="" />
  <title>ログイン | アプトレ</title>
  <link rel="stylesheet" href="styles/main.css" />
</head>
<body class="login-page">
  <main class="landing-wrap login-wrap">
    <section class="hero login-hero">
      <div class="login-hero-inner">
        <p class="hero-kicker login-kicker">Up塾トレーニング</p>
        <h1 class="hero-title login-title">ログイン</h1>
        <p class="hero-copy login-copy">
          会員認証基盤で本人確認を行います。<br />
          認証後、自動的に学習メニューへ戻ります。
        </p>
      </div>

      <section class="panel login-panel" aria-label="ログインフォーム">
        <button id="login-btn" class="btn btn-primary login-submit" type="button">会員ログインへ進む</button>
        <p id="error-message" class="login-error" hidden></p>
      </section>
    </section>
  </main>

  <script type="module">
    import { DEFAULT_PATHS, redirectToAuth } from "./scripts/auth-client.js";

    document.getElementById("login-btn").addEventListener("click", function () {
      const errorMessage = document.getElementById("error-message");
      try {
        redirectToAuth(DEFAULT_PATHS.login, "dashboard.html");
      } catch (error) {
        errorMessage.textContent = error.message;
        errorMessage.hidden = false;
      }
    });
  </script>
</body>
</html>

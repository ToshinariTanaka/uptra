<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ログイン | アプトレ</title>
  <link rel="stylesheet" href="styles/main.css" />
</head>
<body class="login-page">
  <main class="landing-wrap login-wrap">
    <section class="hero login-hero">
      <div class="login-hero-inner">
        <p class="hero-kicker login-kicker">Up塾トレーニング</p>
        <h1 class="hero-title login-title">ログイン</h1>
        <p class="hero-copy login-copy">
          塾生用ページです。<br />
          会員IDとパスワードを入力してください。
        </p>
      </div>

      <section class="panel login-panel" aria-label="ログインフォーム">
        <form id="login-form">
          <label class="form-label" for="member-id">会員ID</label>
          <input class="form-input" id="member-id" name="memberId" required autocomplete="username" />
          <label class="form-label" for="password">パスワード</label>
          <input
            class="form-input"
            id="password"
            type="password"
            placeholder="パスワードを入力"
            autocomplete="current-password"
            required
          />
          <button class="btn btn-primary login-submit" type="submit">ログイン</button>
          <p id="error-message" class="login-error" style="display: none;">
            ログインに失敗しました。
          </p>
        </form>
      </section>
    </section>
  </main>

  <script type="module">
    import { login } from "./scripts/auth-client.js";
    document.getElementById("login-form").addEventListener("submit", async function (e) {
      e.preventDefault();
      const memberId = document.getElementById("member-id").value;
      const password = document.getElementById("password").value;
      const errorMessage = document.getElementById("error-message");
      errorMessage.style.display = "none";
      try {
        await login(memberId, password);
        window.location.href = "dashboard.html";
      } catch (error) {
        errorMessage.textContent = error.message;
        errorMessage.style.display = "block";
      }
    });
  </script>
</body>
</html>
